<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d18" />
    <title>Lumi is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #080d18;
        color: #f5f7fa;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(190 18 60 / 0.2), transparent 58%),
          #080d18;
        text-align: center;
      }
      main { width: min(100%, 28rem); }
      img { width: 72px; height: 72px; }
      h1 { margin: 24px 0 8px; font-size: clamp(1.75rem, 8vw, 2.5rem); }
      p { margin: 0; color: #cbd5e1; line-height: 1.6; }
      button {
        margin-top: 28px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #fb7185;
        color: #080d18;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      a { display: block; margin-top: 18px; color: #c7d2e0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/lumi.svg" alt="" />
      <h1>You’re offline</h1>
      <p>Lumi needs an internet connection to load movie details and streaming sources. Reconnect and try again. Previously loaded pages may still be available.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <a href="/">Go to Lumi home</a>
    </main>
  </body>
</html>
